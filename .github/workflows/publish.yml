name: Publish

# npm trusts this workflow (trusted publishing), so the repository stores no npm token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: The tag matches package.json
        run: |
          version=$(node -p 'require("./packages/shopify-app-workers/package.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          }
      - run: vp check
      - run: vp test run
        working-directory: packages/shopify-app-workers
      - run: vp test run --project unit
        working-directory: apps/testbed
      - run: vp test run --project integ
        working-directory: apps/testbed
      - run: vp run build
        working-directory: packages/shopify-app-workers
      - run: npm install -g npm@latest
      # npm "auto-corrects" a manifest it dislikes by dropping fields, and only warns. Fail instead.
      - name: npm accepts the manifest unchanged
        working-directory: packages/shopify-app-workers
        run: |
          npm publish ./dist --dry-run 2>&1 | tee publish-dry-run.txt
          ! grep -q "auto-corrected" publish-dry-run.txt
      - run: npm publish ./dist --provenance
        working-directory: packages/shopify-app-workers
